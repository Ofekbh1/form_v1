<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Obot – טופס דיגיטלי עם תמונות וחתימה</title>

  <meta name="description" content="טופס דיגיטלי הכולל פרטי עובד, תמונות, תיאור וחתימה דיגיטלית" />

  <style>
    :root {
      --bg: #f6f7fb;
      --card: #ffffff;
      --text: #0f172a;
      --muted: #64748b;
      --border: #e2e8f0;
      --primary: #1878FA;
      --danger: #ef4444;
      --radius: 16px;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 20px;
    }

    .wrap { max-width: 620px; margin: auto; }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 18px;
    }

    h1 { font-size: 22px; margin-bottom: 6px; }
    h2 { font-size: 16px; margin-top: 24px; }
    .sub { font-size: 14px; color: var(--muted); }

    .grid { display: grid; gap: 12px; }

    input {
      width: 100%;
      padding: 12px;
      border-radius: 12px;
      border: 1px solid var(--border);
      font-size: 15px;
    }

    canvas {
      width: 100%;
      height: 180px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: #fff;
      touch-action: none;
    }

    button {
      padding: 12px;
      border-radius: 12px;
      font-size: 15px;
      cursor: pointer;
      width: 100%;
      border: none;
    }

    .btnPrimary { background: var(--primary); color: #fff; font-weight: bold; }
    .btnGhost { background: #fff; border: 1px solid var(--border); }
    .btnDanger { background: #fee2e2; color: #7f1d1d; }

    .imgBlock {
      border: 1px dashed var(--border);
      padding: 12px;
      border-radius: 12px;
      background: #fafafa;
    }

    .status {
      margin-top: 12px;
      padding: 10px;
      border-radius: 12px;
      font-size: 14px;
      display: none;
    }

    .status.ok { display:block; background:#e6f7ec; color:#065f46; }
    .status.err { display:block; background:#fee2e2; color:#7f1d1d; }

    footer {
      margin-top: 24px;
      font-size: 12px;
      color: var(--muted);
      text-align: center;
    }
  </style>
</head>

<body>
<div class="wrap">
  <div class="card">

    <h1>טופס עבודה דיגיטלי</h1>
    <p class="sub">מילוי פרטים, הוספת תמונות וחתימה דיגיטלית</p>

    <form id="form" class="grid" autocomplete="off">

      <h2>פרטי עובד</h2>
      <input id="workDate" type="date" required />
      <input id="workerName" placeholder="שם העובד" required />
      <input id="workerId" placeholder="תעודת זהות" required />

      <h2>תמונות</h2>
      <div id="imagesContainer" class="grid"></div>

      <button type="button" class="btnGhost" onclick="addImageField()">
        ➕ הוסף תמונה
      </button>

      <h2>חתימה דיגיטלית</h2>
      <canvas id="sig"></canvas>
      <button type="button" class="btnGhost" id="clearSig">נקה חתימה</button>

      <button type="submit" class="btnPrimary">שלח טופס</button>
      <div id="status" class="status"></div>

    </form>

    <footer>
      © 2026 Obot · שליחה מאובטחת
    </footer>

  </div>
</div>

<script>
const WEBHOOK_URL = "https://obotdev.biz/webhook/signature-form";

// ===== חתימה =====
const canvas = document.getElementById("sig");
const ctx = canvas.getContext("2d");
let drawing = false;
let hasInk = false;

function resizeCanvas() {
  const r = window.devicePixelRatio || 1;
  canvas.width = canvas.offsetWidth * r;
  canvas.height = 180 * r;
  ctx.setTransform(r, 0, 0, r, 0, 0);
  ctx.lineWidth = 2;
}
resizeCanvas();
window.onresize = resizeCanvas;

canvas.onpointerdown = e => {
  drawing = true;
  ctx.beginPath();
  ctx.moveTo(e.offsetX, e.offsetY);
};

canvas.onpointermove = e => {
  if (!drawing) return;
  ctx.lineTo(e.offsetX, e.offsetY);
  ctx.stroke();
  hasInk = true;
};

canvas.onpointerup = () => drawing = false;

clearSig.onclick = () => {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  hasInk = false;
};

// ===== תמונות דינאמיות =====
function addImageField() {
  const container = document.getElementById("imagesContainer");

  const block = document.createElement("div");
  block.className = "imgBlock grid";

  block.innerHTML = `
    <input type="file" accept="image/*" required />
    <input placeholder="תיאור התמונה" />
    <button type="button" class="btnDanger">הסר תמונה</button>
  `;

  block.querySelector("button").onclick = () => block.remove();
  container.appendChild(block);
}

// ===== שליחה =====
form.onsubmit = async e => {
  e.preventDefault();
  const status = document.getElementById("status");

  if (!hasInk) {
    status.textContent = "נא לחתום לפני השליחה";
    status.className = "status err";
    return;
  }

  const images = [];
  const blocks = document.querySelectorAll(".imgBlock");

  for (const block of blocks) {
    const file = block.querySelector('input[type="file"]').files[0];
    const desc = block.querySelector('input[type="text"]').value;
    if (!file) continue;

    const base64 = await toBase64(file);
    images.push({
      filename: file.name,
      description: desc,
      data: base64
    });
  }

  const payload = {
    workDate: workDate.value,
    workerName: workerName.value,
    workerId: workerId.value,
    images,
    signature: canvas.toDataURL("image/png"),
    submittedAt: new Date().toISOString(),
    userAgent: navigator.userAgent
  };

  try {
    await fetch(WEBHOOK_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload)
    });

    status.textContent = "הטופס נשלח בהצלחה ✅";
    status.className = "status ok";
    form.reset();
    clearSig.onclick();

  } catch {
    status.textContent = "שגיאה בשליחה";
    status.className = "status err";
  }
};

function toBase64(file) {
  return new Promise(resolve => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result);
    reader.readAsDataURL(file);
  });
}
</script>
</body>
</html>
